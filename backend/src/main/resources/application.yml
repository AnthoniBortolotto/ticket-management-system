spring:
  application:
    name: ticket-system

  datasource:
    # Defaults casam com o servico postgres do docker/docker-compose.yml, entao
    # `./mvnw spring-boot:run` funciona sem nenhum .env depois de subir o banco.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketsystem}
    username: ${DB_USER:ticketsystem}
    password: ${DB_PASSWORD:ticketsystem}

  jpa:
    hibernate:
      # Schema e responsabilidade do Flyway. Nunca `update`.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Boot 4 usa Jackson 3 (tools.jackson). O formato das datas fica em JacksonConfig:
    # a flag mudou de enum no Jackson 3 e nao tem mais propriedade equivalente aqui.
    time-zone: UTC
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.ticketsystem: ${LOG_LEVEL:INFO}
