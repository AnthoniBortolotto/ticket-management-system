spring:
  application:
    name: ticket-system

  # Le backend/.env se ele existir. O sufixo [.properties] e obrigatorio: sem ele o Boot
  # nao sabe como interpretar um arquivo sem extensao e ignora o import em silencio.
  # `optional:` mantem o boot funcionando onde as variaveis vem do ambiente (Compose,
  # Kubernetes) em vez de arquivo.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Defaults casam com o servico postgres do docker/docker-compose.yml, entao
    # `./mvnw spring-boot:run` funciona sem nenhum .env depois de subir o banco.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketsystem}
    username: ${DB_USER:ticketsystem}
    password: ${DB_PASSWORD:ticketsystem}

  jpa:
    hibernate:
      # Schema e responsabilidade do Flyway. Nunca `update`.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    # So as migrations de dominio. O seed de demonstracao mora em classpath:db/seed e
    # e o perfil dev que acrescenta aquela location.
    locations: classpath:db/migration
    # O seed de demonstracao (db/seed) e uma migration repetivel que so o perfil dev
    # carrega. Sem esta linha, subir a MESMA base sem o perfil dev quebra na validacao com
    # "Detected applied migration not resolved locally" — e essa sequencia esta nos
    # comandos do CLAUDE.md: desenvolve-se com `spring-boot:run` (dev) e roda-se o E2E com
    # `docker compose up -d` (sem dev), os dois contra o mesmo volume do Postgres.
    #
    # O padrao ignora so repetivel ausente. Versionada ausente ou alterada continua
    # derrubando o boot, que e o que protege a linha de migrations de dominio.
    ignore-migration-patterns: "repeatable:missing"
    placeholders:
      # Alimentam V3__seed_admin_user.sql.
      #
      # ADMIN_PASSWORD_HASH nao tem default AQUI de proposito: um default no codigo da
      # aplicacao valeria para todo ambiente, inclusive os que ninguem configurou.
      #
      # Seja honesto sobre o que isso protege: backend/.env.example e k8s/base/config.yaml
      # trazem um hash de desenvolvimento publicado, entao quem segue o README acaba com
      # admin/admin123 — de proposito, para o projeto rodar sem setup. O que esta
      # regra garante e que um ambiente que NAO copiou nenhum desses arquivos nao sobe
      # com um admin de senha conhecida: ele nao sobe, ponto.
      #
      # Cuidado ao mexer: se a variavel nao existir, o Spring NAO reclama — ele deixa
      # `${ADMIN_PASSWORD_HASH}` como texto literal e o Flyway grava esse texto como se
      # fosse a senha. Quem pega isso e o CHECK users_password_hash_is_bcrypt da V2, que
      # recusa o INSERT e derruba o boot. Verificado rodando, nao deduzido.
      #
      # Para desenvolver: `cp backend/.env.example backend/.env`. O arquivo ja traz um
      # hash de desenvolvimento e e lido pelo `spring.config.import` la em cima.
      admin_email: ${ADMIN_EMAIL:admin@ticketsystem.local}
      admin_password_hash: ${ADMIN_PASSWORD_HASH}

  modulith:
    events:
      # ARCHIVE: evento concluido sai da tabela ativa e vai para o arquivo, entao a
      # varredura de pendentes no start nao cresce com o historico.
      #
      # Nao existe aqui nenhuma propriedade desligando a criacao automatica do schema:
      # ela pertence ao registro JDBC, e este projeto usa o JPA. O schema vem da
      # migration V1 e o `ddl-auto: validate` confere.
      completion-mode: archive

  jackson:
    # Boot 4 usa Jackson 3 (tools.jackson). O formato das datas fica em JacksonConfig:
    # a flag mudou de enum no Jackson 3 e nao tem mais propriedade equivalente aqui.
    time-zone: UTC
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

ticketsystem:
  auth:
    # Sem default no codigo, de proposito: um valor aqui valeria para todo ambiente,
    # inclusive os que ninguem configurou, e assinar token com chave publicada no
    # repositorio e o mesmo erro que o ADMIN_PASSWORD_HASH quase produziu.
    #
    # O default vazio abaixo nao e um segredo fraco: `AuthProperties` recusa valor vazio,
    # valor com menos de 32 bytes e o texto literal `${JWT_SECRET}` — este ultimo porque
    # o Spring nao reclama de variavel de ambiente ausente, ele deixa o placeholder como
    # texto. Sem isso, a aplicacao subiria assinando com essa string.
    #
    # Para desenvolver: `cp backend/.env.example backend/.env`.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:ticket-system}
    access-token-ttl: ${JWT_EXPIRATION_MINUTES:60}m
    refresh-token-ttl: ${JWT_REFRESH_DAYS:7}d
    # Bloqueio de conta apos tentativas de login fracassadas. Fica em configuracao, e nao
    # em banco: prazo de SLA e dado de negocio que um admin edita em runtime, mas isto e
    # parametro operacional de seguranca, que muda com deploy.
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_MINUTES:15}m

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.ticketsystem: ${LOG_LEVEL:INFO}
